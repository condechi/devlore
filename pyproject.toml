[project]
name = "devlore-kb-stub"
version = "0.9.27"
description = "devlore knowledge base (per-KB marker only — v0.9.27+ centralizes the venv at ~/.devlore/.venv/ and the launcher at ~/.devlore/bin/devlore)"
requires-python = ">=3.12"
# v0.9.27: no per-KB dependencies. The shared machinery's deps live at
# ~/.devlore/.venv/ and are installed from dist/lib/pyproject.toml once for
# all KBs by `devlore init` / `devlore update`. This file exists so `uv` and
# other tooling that reads pyproject.toml still finds a project root, but it
# must not declare deps that materializes a per-KB .venv on a stray `uv sync`.
dependencies = []

[tool.ruff]
line-length = 100
