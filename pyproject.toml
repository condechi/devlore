[project]
name = "devlore-kb"
version = "0.9.25"
description = "devlore knowledge base (per-KB stub — shared machinery lives at ~/.devlore/lib/)"
requires-python = ">=3.12"
# KB-local scripts use the Agent SDK (flush.py, ingest_all_context.py,
# compile.py, query.py…) inline, so the per-KB .venv/ still needs the deps.
# The shared lib at ~/.devlore/lib/ also has a pyproject.toml with the same
# deps — they're declared twice so the .venv/ can be rebuilt standalone. The
# shared lib BY ITSELF doesn't need a venv (pure stdlib + sibling deps).
dependencies = [
    "claude-agent-sdk>=0.1.29",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[tool.ruff]
line-length = 100
